<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
 <!-- Shotlet: a capture panel, a diagonal cut revealing the dark layer under it.
      Landscape icon on GNOME's grid: ~88% of the width, centred, a soft shadow below. -->
 <defs>
  <linearGradient id="rear" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0%" stop-color="#68747F"/><stop offset="45%" stop-color="#39424D"/><stop offset="100%" stop-color="#202934"/>
  </linearGradient>
  <linearGradient id="front" x1="0.02" y1="0" x2="0.95" y2="1">
   <stop offset="0%" stop-color="#FDFDFD"/><stop offset="35%" stop-color="#EDEFF0"/><stop offset="75%" stop-color="#C3CBD1"/><stop offset="100%" stop-color="#A4B0BD"/>
  </linearGradient>
  <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".1"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="panel"><rect x="64" y="201" width="896" height="622" rx="124"/></clipPath>
 </defs>
 <!-- shadow -->
 <rect x="82" y="236" width="860" height="617" rx="128" fill="#101720" opacity=".24" filter="url(#shadow)"/>
 <g clip-path="url(#panel)">
  <rect x="64" y="201" width="896" height="622" fill="url(#rear)"/>
  <path d="M64 201 H960 V357 L427 823 H64 Z" fill="url(#front)"/>
  <!-- the cut: a shade on the dark side, a light edge on the panel -->
  <path d="M426 824 L961 356" stroke="#111D28" stroke-opacity=".3" stroke-width="32"/>
  <path d="M426 823 L960 357" stroke="url(#fold)" stroke-width="6"/>
 </g>
 <!-- edge: a dark hairline outside reads on light backgrounds, a light one inside on dark -->
 <rect x="63" y="200" width="898" height="624" rx="125" fill="none" stroke="#0F1720" stroke-opacity=".22" stroke-width="2"/>
 <rect x="65.5" y="202.5" width="893" height="619" rx="122.5" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3"/>
</svg>

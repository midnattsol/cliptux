name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs (tags can be moved)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Run tests
        run: zig build test

      # both architectures in one job, so a single SHA256SUMS covers every
      # artifact of the release
      - name: Build and package
        run: |
          set -eu
          for spec in x86_64-linux-gnu.2.31:x86_64 aarch64-linux-gnu.2.31:arm64; do
            target=${spec%%:*}
            arch=${spec##*:}
            rm -rf zig-out
            zig build -Doptimize=safe -Dtarget="$target"
            name="shotlet-${GITHUB_REF_NAME}-linux-${arch}"
            mkdir -p "dist/$name"
            cp zig-out/bin/shotlet shotlet.desktop shotlet.svg README.md LICENSE "dist/$name/"
            tar -C dist -czf "$name.tar.gz" "$name"
          done
          sha256sum shotlet-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            shotlet-*.tar.gz
            SHA256SUMS
          generate_release_notes: true

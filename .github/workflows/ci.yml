name: CI

on:
  # PRs are the primary gate; the push trigger covers direct pushes to main
  # and verifies the actual merge result (PR runs test the PR head only)
  pull_request:
    branches: [main]
  push:
    branches: [main]

# supersede in-flight runs when new commits land on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs (tags can be moved)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Run tests
        # includes a portal integration test on a private dbus-daemon
        # (skipped automatically where dbus-daemon is missing)
        run: zig build test --summary all

      - name: Build (native, safe)
        run: zig build -Doptimize=safe

      - name: Cross-compile x86_64
        run: zig build -Doptimize=safe -Dtarget=x86_64-linux-gnu.2.31

      - name: Cross-compile arm64
        run: zig build -Doptimize=safe -Dtarget=aarch64-linux-gnu.2.31
